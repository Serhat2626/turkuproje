spring:
  application:
    name: anadolu-atlasi-backend
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ── AI Provider ──────────────────────────────────────
# Varsayılan: mock (gerçek AI çağrısı yapılmaz)
# Gerçek provider için: ai.provider=openai ve ai.openai.api-key env variable
ai:
  provider: mock
