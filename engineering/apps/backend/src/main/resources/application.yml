spring:
  application:
    name: anadolu-atlasi-backend
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8089
  tomcat:
    connection-timeout: 300000    # 5 dakika — büyük video dosyaları için
    keep-alive-timeout: 300000
  servlet:
    session:
      timeout: 30m

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ── AI Provider ──────────────────────────────────────
# Varsayılan: mock (gerçek AI çağrısı yapılmaz)
# Gerçek provider için: ai.provider=openai ve ai.openai.api-key env variable
ai:
  provider: mock

# ── Image Generation Provider ────────────────────────
# FP-007: Image generation provider config.
# Default: mock — external call yapılmaz.
# OpenAI için: imagegen.provider.mode=openai
# API key: IMAGEGEN_PROVIDER_OPENAI_API_KEY env variable ile verilmelidir.
# API key bu dosyaya YAZILMAZ.
imagegen:
  provider:
    mode: mock
    timeout-ms: 60000
    max-output-count: 1
    model-name: dall-e-3
    image-size: 1024x1024
    openai-api-key: ${IMAGEGEN_PROVIDER_OPENAI_API_KEY:}

# ── JWT Authentication ────────────────────────────────
# Secret: en az 256-bit (32 byte) olmalıdır.
# Production'da JWT_SECRET env variable ile verilmelidir.
# Bu dosyaya gerçek secret YAZILMAZ.
jwt:
  secret: ${JWT_SECRET:anadolu-atlasi-dev-secret-key-minimum-256-bits-2026-change-in-production}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}  # 7 gün (dev), production'da kısaltılmalı
