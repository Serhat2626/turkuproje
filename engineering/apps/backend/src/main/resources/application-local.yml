spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:anadolu_atlasi}
    username: ${POSTGRES_USER:anadolu}
    password: ${POSTGRES_PASSWORD:anadolu_dev}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    clean-disabled: false

# MinIO konfigürasyonu
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minio}
  secret-key: ${MINIO_ROOT_PASSWORD:minio123}
  bucket-name: ${MINIO_BUCKET:anadolu-media}

# AI Provider konfigürasyonu
ai:
  provider: ${AI_PROVIDER:openai}
  tts-provider: ${AI_TTS_PROVIDER:openai}  # 'openai' veya 'elevenlabs'
  image-provider: ${AI_IMAGE_PROVIDER:openai}  # 'openai' veya 'fal'
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o}
    timeout-seconds: 120
    max-output-tokens: 4000
    temperature: 0.7
  elevenlabs:
    api-key: ${ELEVENLABS_API_KEY:}
    voice-id: ${ELEVENLABS_VOICE_ID:EXAVITQu4vr4xnSDxMaL}
    model-id: eleven_multilingual_v2
    stability: 0.5
    similarity-boost: 0.75
    style: 0.4
  fal:
    api-key: ${FAL_API_KEY:}
    model: fal-ai/flux-pro/v1.1
    image-size: landscape_16_9
    num-inference-steps: 28
    guidance-scale: 3.5
  video-provider: ${AI_VIDEO_PROVIDER:kling}  # 'none' veya 'kling'
  kling:
    model: fal-ai/kling-video/v2/master/image-to-video
    duration: "5"
    motion-prompt-suffix: "Gentle, subtle natural movement. Cinematic camera. Photorealistic."

logging:
  level:
    com.anadoluatlasi.backend: DEBUG
