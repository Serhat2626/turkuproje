spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:anadolu_atlasi}?sslmode=disable
    username: ${POSTGRES_USER:anadolu}
    password: ${POSTGRES_PASSWORD:anadolu_local_dev}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    clean-disabled: false

# MinIO konfigürasyonu
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minio}
  secret-key: ${MINIO_ROOT_PASSWORD:minio123}
  bucket-name: ${MINIO_BUCKET:anadolu-media}

# AI Provider konfigürasyonu (varsayılan: mock — harici ücretli API gerektirmez)
ai:
  provider: ${AI_PROVIDER:mock}
  tts-provider: ${AI_TTS_PROVIDER:elevenlabs}  # 'openai' veya 'elevenlabs'
  image-provider: ${AI_IMAGE_PROVIDER:fal}  # 'openai' veya 'fal'
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o}
    timeout-seconds: 180
    # max-output-tokens: Kısıtlanmıyor (Java default: 32000). Bütçe takibi loglardan yapılır.
    temperature: 0.7
  elevenlabs:
    api-key: ${ELEVENLABS_API_KEY:}
    voice-id: ${ELEVENLABS_VOICE_ID:fZEjvS1BvpajAoOmWcEO}  # "Fatih" — Türkçe hikâye anlatıcı
    model-id: eleven_multilingual_v2
    stability: 0.35        # Düşük = daha duygusal iniş-çıkışlar
    similarity-boost: 0.80  # Sesin doğal karakterini korur
    style: 0.65             # Yüksek = daha dramatik anlatım
  fal:
    api-key: ${FAL_API_KEY:}
    model: fal-ai/flux-pro/v1.1
    image-size: landscape_16_9
    num-inference-steps: 28
    guidance-scale: 3.5
  video-provider: ${AI_VIDEO_PROVIDER:none}  # 'none' veya 'kling'
  kling:
    model: fal-ai/kling-video/v2/master/image-to-video
    duration: "5"
    motion-prompt-suffix: "Gentle, subtle natural movement. Cinematic camera. Photorealistic."

logging:
  level:
    com.anadoluatlasi.backend: DEBUG
