spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:anadolu_atlasi}
    username: ${POSTGRES_USER:anadolu}
    password: ${POSTGRES_PASSWORD:anadolu_dev}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    clean-disabled: false

# MinIO konfigürasyonu
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minio}
  secret-key: ${MINIO_ROOT_PASSWORD:minio123}
  bucket-name: ${MINIO_BUCKET:anadolu-media}

# AI Provider konfigürasyonu
ai:
  provider: ${AI_PROVIDER:openai}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o}
    timeout-seconds: 120
    max-output-tokens: 4000
    temperature: 0.7

logging:
  level:
    com.anadoluatlasi.backend: DEBUG
