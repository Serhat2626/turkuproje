spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:anadolu_atlasi_staging}
    username: ${POSTGRES_USER:anadolu_staging}
    password: ${POSTGRES_PASSWORD:REDACTED_SECRET}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 5

# MinIO konfigürasyonu
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minio}
  secret-key: ${MINIO_ROOT_PASSWORD:minio123}
  bucket-name: ${MINIO_BUCKET:anadolu-media}

logging:
  level:
    com.anadoluatlasi.backend: DEBUG
