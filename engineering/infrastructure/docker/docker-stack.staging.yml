# ================================================================
# Anadolu Atlası - Staging Stack (Docker Swarm)
# ================================================================
#
# Manuel deploy:
#   export AI_OPENAI_API_KEY="sk-proj-..."
#   export POSTGRES_PASSWORD="REDACTED_SECRET"
#   docker stack deploy -c docker-stack.staging.yml --resolve-image never anadolu-atlasi-staging
#
# CI/CD deploy:
#   CI pipeline otomatik olarak image build/push yapar ve stack deploy eder.
#   Image tag'leri CI_COMMIT_REF_NAME (branch adı) ile belirlenir.
#
# Rollback:
#   docker service update --env-add AI_PROVIDER=mock anadolu-atlasi-staging_backend
#
# Kaldırma:
#   docker stack rm anadolu-atlasi-staging
# ================================================================

version: "3.8"

services:

  # ── Staging Backend ──────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-registry.gitlab.com/solostartup/turkuproje/backend:staging}
    ports:
      - "8081:8080"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 384M
    environment:
      SPRING_PROFILES_ACTIVE: staging
      # ── DB (host PostgreSQL via docker0 bridge) ──
      POSTGRES_HOST: 172.17.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: anadolu_atlasi_staging
      POSTGRES_USER: anadolu_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-REDACTED_SECRET}
      # ── Redis (stack-internal service) ──
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # ── AI Provider ──
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-gpt-4o-mini}
    networks:
      - aa-staging-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Staging Redis ──────────────────────────────────
  redis:
    image: redis:7-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    volumes:
      - redis_staging_data:/data
    networks:
      - aa-staging-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Staging Admin Web ──────────────────────────────
  admin-web:
    image: ${ADMIN_WEB_IMAGE:-registry.gitlab.com/solostartup/turkuproje/admin-web:staging}
    ports:
      - "5174:5173"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - aa-staging-internal

networks:
  aa-staging-internal:
    driver: overlay

volumes:
  redis_staging_data:
