# Local profili - lokal geliştirme ortamı
spring:
  # PostgreSQL lokal bağlantı
  datasource:
    url: jdbc:postgresql://localhost:5432/turkuproje
    username: turkuproje_user
    password: Turku2026!Proje
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate ayarları
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Spring AI - OpenAI ayarları
  ai:
    openai:
      api-key: YOUR_OPENAI_API_KEY_HERE
      chat:
        options:
          model: gpt-4o
          temperature: 0.7
          max-tokens: 4000
