spring:
  application:
    name: turkuproje

  # PostgreSQL veritabanı bağlantısı
  datasource:
    url: jdbc:postgresql://localhost:5432/turkuproje
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate ayarları
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Spring AI - OpenAI ayarları
  ai:
    openai:
      api-key: YOUR_OPENAI_API_KEY_HERE
      chat:
        options:
          model: gpt-4o
          temperature: 0.7
          max-tokens: 4000

server:
  port: 8080

# Uygulama özel ayarları
app:
  ai:
    default-model: gpt-4o
    max-retries: 3
